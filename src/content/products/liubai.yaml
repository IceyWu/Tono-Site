# 一个 app 一个文件：文件名即 URL 段（/liubai）。
# 新增 app 只需在此目录再放一个 yaml，首页列表和产品页会自动出现，不用改任何代码。
order: 1

# 字标不翻译：中文字标是品牌资产，英文页同样沿用，下方以拉丁名注解
name: 留白
latinName: LiuBai

# 页面配色：warm 为暖白底
theme: warm

# 上架后填入链接，按钮会自动从「即将上线」变成可点击的 App Store
appStoreUrl: null

operatingSystem: iOS, iPadOS

copy:
  zh-CN:
    titleSuffix: 随笔记录
    tagline: 在空白处，写下你的灵感
    description: 留白是一款安静记录灵感的随笔应用。本地优先，不上传、不追踪，打开就写，把注意力留给文字本身。
    features:
      - 随笔记录
      - 灵感捕捉
      - 本地优先
  en:
    titleSuffix: Notes & Ideas
    tagline: Write your ideas in the blank space
    description: LiuBai is a quiet notes app for catching ideas. Local-first — nothing uploaded, nothing tracked. Open it and write.
    features:
      - Quick notes
      - Catch ideas
      - Local-first
